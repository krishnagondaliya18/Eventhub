<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand"><span>🎪</span> <span class="brand-name">EventHub</span></div>
    <div class="auth-visual">
      <h2>Join the EventHub community</h2>
      <p>Create your account and start exploring events.</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-box">
      <h1>Create account</h1>
      <p class="auth-sub">Join EventHub for free today</p>
      @if (error) { <div class="alert alert-error">{{ error }}</div> }
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input class="form-control" type="text" placeholder="John Doe" [(ngModel)]="form.name">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input class="form-control" type="email" placeholder="you@example.com" [(ngModel)]="form.email">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password *</label>
          <input class="form-control" type="password" placeholder="Min 6 characters" [(ngModel)]="form.password">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input class="form-control" type="tel" placeholder="+91 9876543210" [(ngModel)]="form.phone">
        </div>
      </div>

      <div class="form-group">
        <label>I want to join as *</label>
        <div class="role-selector-grid">
          <label class="role-card" [class.selected]="form.role === 'user'">
            <input type="radio" name="role" value="user" [(ngModel)]="form.role" class="hidden-radio">
            <span class="role-icon">🎟️</span>
            <div>
              <strong>Attendee / User</strong>
              <p>Discover events &amp; book tickets</p>
            </div>
          </label>
          <label class="role-card" [class.selected]="form.role === 'organizer'">
            <input type="radio" name="role" value="organizer" [(ngModel)]="form.role" class="hidden-radio">
            <span class="role-icon">🎪</span>
            <div>
              <strong>Event Organizer</strong>
              <p>Host &amp; manage public events</p>
            </div>
          </label>
        </div>
      </div>

      <button class="btn btn-primary btn-lg w-full" (click)="register()" [disabled]="loading">
        {{ loading ? 'Creating Account...' : (form.role === 'organizer' ? 'Join as Organizer' : 'Create User Account') }}
      </button>
      <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in →</a></p>
    </div>
  </div>
</div>
