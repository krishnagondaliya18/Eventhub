<div class="auth-page">
  <div class="auth-left">
    <div class="auth-brand"><span>🎪</span> <span class="brand-name">EventHub</span></div>
    <div class="auth-visual">
      <h2>Join the EventHub community</h2>
      <p>Create your account and start exploring events.</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-box">
      <h1>Create account</h1>
      <p class="auth-sub">Join EventHub for free today</p>
      @if (error) { <div class="alert alert-error">{{ error }}</div> }
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input class="form-control" type="text" placeholder="John Doe" [(ngModel)]="form.name">
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input class="form-control" type="email" placeholder="you@example.com" [(ngModel)]="form.email">
        </div>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input class="form-control" type="password" placeholder="Min 6 characters" [(ngModel)]="form.password">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Phone</label>
          <input class="form-control" type="text" placeholder="9999999999" [(ngModel)]="form.phone">
        </div>
        <div class="form-group">
          <label>Department</label>
          <input class="form-control" type="text" placeholder="e.g. CT" [(ngModel)]="form.department">
        </div>
      </div>
      <div class="form-group">
        <label>Year</label>
        <select class="form-control" [(ngModel)]="form.year">
          <option value="">Select Year</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>
      </div>
      <button class="btn btn-primary btn-lg w-full" (click)="register()" [disabled]="loading">
        {{ loading ? 'Creating...' : 'Create Account' }}
      </button>
      <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in →</a></p>
    </div>
  </div>
</div>
